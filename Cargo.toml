[package]
name = "smidr"
version = "0.3.0"
edition = "2021"
description = "Interactive 3D model generator using Claude CLI"
build = "build.rs"

[[bin]]
name = "smidr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
tempfile = "3"
wait-timeout = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
webbrowser = "1.2.4"
ureq = { version = "3.3.0", features = ["json", "rustls"] }

[features]
embed-frontend = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tungstenite = "0.30.0"
